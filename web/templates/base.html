<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}} · boobies·media</title>
<meta name="description" content="Your flock’s private media library for sharing photos, GIFs, and videos.">
{{if .SiteURL}}
<link rel="canonical" href="{{.SiteURL}}/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="boobies-media">
<meta property="og:title" content="boobies-media">
<meta property="og:description" content="Your flock’s private media library for sharing photos, GIFs, and videos.">
<meta property="og:url" content="{{.SiteURL}}/">
<meta property="og:image" content="{{.SiteURL}}/static/brand/social-card.jpg">
<meta property="og:image:secure_url" content="{{.SiteURL}}/static/brand/social-card.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="boobies-media — your flock’s private media library">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="boobies-media">
<meta name="twitter:description" content="Your flock’s private media library for sharing photos, GIFs, and videos.">
<meta name="twitter:image" content="{{.SiteURL}}/static/brand/social-card.jpg">
<meta name="twitter:image:alt" content="boobies-media — your flock’s private media library">
{{end}}
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/static/dist/main.css">
<script type="module" src="/static/dist/main.js" defer></script>
</head>
<body>
{{if .User}}
<header class="topbar">
  <div class="topbar__brand">
    <a href="/" aria-label="boobies media home">
      <img src="/static/brand/booby-logo.webp" width="34" height="34" alt="">
      <span>boobies&middot;media</span>
    </a>
  </div>
  {{if .Storage}}
  <div class="topbar__storage"
       role="progressbar" aria-label="Media storage used"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{.Storage.Percent}}"
       title="{{fmtBytes .Storage.UsedBytes}} of {{fmtBytes .Storage.CapacityBytes}} available media capacity used">
    <div class="topbar__storage-label">
      <span>Media storage</span>
      <span>{{fmtBytes .Storage.UsedBytes}} / {{fmtBytes .Storage.CapacityBytes}}</span>
    </div>
    <span class="topbar__storage-track"><span style="width:{{.Storage.Percent}}%"></span></span>
  </div>
  {{else}}
  <div></div>
  {{end}}
  <div class="topbar__user">
    <span>{{.User.DisplayName}}</span>
    {{if .User.IsAdmin}}<a href="/admin" class="topbar__admin">Admin</a>{{end}}
    <form method="post" action="/logout"><button type="submit">Sign out</button></form>
  </div>
</header>
{{end}}
<main>
{{template "content" .}}
</main>
</body>
</html>
